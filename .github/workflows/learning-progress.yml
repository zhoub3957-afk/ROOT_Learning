name: Update learning progress

on:
  push:
    branches: [main]
    paths:
      - '**/lesson*.C'
      - '.github/workflows/learning-progress.yml'

permissions:
  contents: write

jobs:
  update-progress:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate progress report
        shell: bash
        run: |
          mapfile -t lessons < <(find ./lessons -type f -name 'lesson*.C' | sort -V)
          total=${#lessons[@]}
          percent=0
          if [ "$total" -gt 0 ]; then
            percent=100
          fi

          {
            echo '# ROOT Learning Progress'
            echo
            echo 'This report is generated from the ROOT lesson source files in the repository.'
            echo
            echo "- Lessons found: **$total**"
            echo "- Recorded lesson coverage: **$percent%**"
            echo
            echo '## Lessons'
            echo
            for file in "${lessons[@]}"; do
              filename="${file#./lessons/}"
              echo "- [x] **${filename}** — [source](lessons/${filename})"
            done
          } > LEARNING_PROGRESS.md

      - name: Commit progress report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add LEARNING_PROGRESS.md
          git diff --cached --quiet || git commit -m 'Update ROOT learning progress'
          git push
